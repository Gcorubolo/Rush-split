<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  />

  <meta
    name="theme-color"
    content="#0b0d10"
  />

  <meta
    name="description"
    content="RUSH SPLIT — Dividí. Saldá. Listo."
  />

  <link
    rel="manifest"
    href="manifest.webmanifest"
  />

  <title>RUSH SPLIT</title>

  <link
    rel="stylesheet"
    href="css/style.css"
  />
</head>

<body>

  <div class="app-shell">

    <!-- =========================================
         HEADER
         ========================================= -->

    <header class="topbar">

      <div class="brand">

        <span class="brand-mark">
          🥩
        </span>

        <div class="brand-text">
          <strong>RUSH SPLIT</strong>
          <small>Dividí. Saldá. Listo.</small>
        </div>

      </div>

      <button
        class="icon-btn"
        id="settingsBtn"
        title="Configuración"
        aria-label="Configuración"
      >
        ⚙️
      </button>

    </header>


    <!-- =========================================
         MAIN APP
         ========================================= -->

    <main
      id="app"
      class="app-content"
    ></main>


    <!-- =========================================
         BOTTOM NAVIGATION
         ========================================= -->

    <nav
      class="bottom-nav"
      aria-label="Navegación principal"
    >

      <button
        type="button"
        data-view="home"
        class="nav-item active"
        aria-label="Inicio"
      >
        <span>🏠</span>
        <small>Inicio</small>
      </button>


      <button
        type="button"
        data-view="history"
        class="nav-item"
        aria-label="Historial"
      >
        <span>📜</span>
        <small>Historial</small>
      </button>


      <button
        type="button"
        data-view="groups"
        class="nav-item"
        aria-label="Grupos"
      >
        <span>👥</span>
        <small>Grupos</small>
      </button>

    </nav>

  </div>


  <!-- =========================================
       SUPABASE
       ========================================= -->

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>


  <!-- =========================================
       RUSH SPLIT JS
       ========================================= -->

  <script src="js/supabase.js"></script>

  <script src="js/storage.js"></script>

  <script src="js/settlement.js"></script>

  <script src="js/app.js"></script>


  <!-- =========================================
       SERVICE WORKER
       ========================================= -->

  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker
        .register("./sw.js")
        .catch(console.error);
    }
  </script>

</body>
</html>
